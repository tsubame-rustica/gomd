<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pagesでサブディレクトリ（username.github.io/repo-name/）配下の場合は 1、
      // カスタムドメイン直下等の場合は 0 を保持するよう自動判定
      var isGitHubPagesRepo = window.location.hostname.endsWith('github.io') && window.location.pathname.split('/').filter(Boolean).length >= 1;
      var pathSegmentsToKeep = isGitHubPagesRepo ? 1 : 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
